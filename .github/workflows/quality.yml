name: Trusted basket kernel
on:
  push:
    branches: [improve/trusted-nutrition-budget]
    paths: ['next/**', '.github/workflows/quality.yml']
  pull_request:
    branches: [main]
    paths: ['next/**', '.github/workflows/quality.yml']
permissions:
  contents: read
concurrency:
  group: trusted-basket-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Test standalone kernel
        working-directory: next
        run: python -m pytest -q tests/test_trusted_pricing.py --junitxml=kernel-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-test-results
          path: next/kernel-results.xml
          if-no-files-found: warn
          retention-days: 7
